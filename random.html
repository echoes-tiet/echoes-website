<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random</title>
    <link rel="stylesheet" href="random.css">
</head>
<body>
    <div class="banner">
        <p class="typewriter">"Welcome To Echoes"</p>
    </div>
    <div class="rng">

        <label for="upperBound">Choose Number of Members:   </label>
       
        <input type="number" id="upperBound" value="15">
        <div class="row">
            <div class="btn" onclick="generateRandomNumber()">
                Generate
            </div>
            
        </div>
        <div class="output" id="randomNumber">
            <h1 id="randomNumber">-</h1>
        </div>
        <div id="2" class="btn" onclick="redirectToAnotherPage()" >
           LET'S SPIN
        </div>
    </div>
    <script>
        function generateRandomNumber() {
            const upperBound = parseInt(document.getElementById('upperBound').value);
            const randomNumber = Math.floor(Math.random() * upperBound) + 1;
            document.getElementById('randomNumber').textContent = "-";
            setTimeout(function() {
                document.getElementById('randomNumber').textContent = randomNumber;
            }, 1000);
        }
        
        generateRandomNumber();

        function redirectToAnotherPage() {
            window.location.href = 'spin.html'; // Change to your desired page URL
        }
    </script>
</body>
</html>
