<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascade</title>
    <!-- fav  -->
    <link href="assets/img/echoes-icon.png" rel="icon">
    <!-- <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon"> -->
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="teamRed.css">
</head>

<body>
    <style>
        body{
            background-image: url('./background.png');
            background-size: cover;
            background-position: center;
        }
        .logo{
            display: flex;
            justify-content: center;
            align-items: center;
            /* overflow: hidden; */
            /* background: green; */
        }
        img{
            overflow: hidden;
            width: 100vw;
            height: max-content;
        
            
        }
   
    </style>
        
    <div class="wrapper">
        <div class="box">
            <form name="Cascade" action="post">
                <div class="logo">
                    
                    <img src="cascade name.png" alt="">
                </div>
                <div class="input-group">
                  <td>  <input type="text" name="Name" id="name" required>
                    <label for="">Name</label></td>
                </div>
                <div class="input-group">
                    <input type="number" name="RollNumber" id="rollno" required>
                    <label for="">Roll Number</label>
                </div>
                <div class="input-group">
                    <input type="number" name="PhoneNumber" id="rollno" required>
                    <label for="">Phone Number</label>
                </div>
                <div class="input-group">
                    <input type="number"  name="Year" id="year" required>
                    <label for="">Year</label>
                </div>
                <div class="input-group">
                    <input type="text" name="Branch" id="branch" required>
                    <label for="">Branch</label>
                </div>
                <div class="Events">
                    
                    <div>Events :</div>
                    <div class="form-check">
                        <input class="form-check-input" name="childHood" type="checkbox" value="1" id="replay">
                        <label class="form-check-label" for="flexCheckDefault">
                          Childhood Replay
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" name="NewsRoom" type="checkbox" value="1" id="nexus" >
                        <label class="form-check-label" for="flexCheckChecked">
                          Newsroom Nexus
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" name='TriviaNight' value="1" id="night">
                        <label class="form-check-label" for="flexCheckChecked">
                          Trivia Night
                        </label>
                      </div>
                     </div>
                     &nbsp;
               
                <button type="submit" >Submit</button>
            </form>
        </div>
   
    </div>

    <script>
        function addMember() {
            const memberDetailsContainer = document.getElementById('memberDetails');
            const addMemberButton = document.querySelector('.AddMember');
            if (memberDetailsContainer.children.length < 4) { // Max 4 members
                const memberNumber = memberDetailsContainer.children.length + 1;

                const memberSection = document.createElement('div');
                memberSection.innerHTML = `
                    <h2>Member ${memberNumber} Details</h2>
                    <div class="input-group">
                        <input type="text" name="M${memberNumber}Fname" required>
                        <label for="">First Name</label>
                    </div>
                    <div class="input-group">
                        <input type="text" name="M${memberNumber}LastName" required>
                        <label for="">Last Name</label>
                    </div>
                    <div class="input-group">
                        <input type="email" name="M${memberNumber}Email" required>
                        <label for="">Email</label>
                    </div>
                    <div class="input-group">
                        <input type="number" name="M${memberNumber}PhoneNumber" required>
                        <label for="">Phone Number</label>
                    </div>
                    <button class="RemoveMember" type="button" onclick="removeMember(this)">Remove Member</button>
                `;

                memberDetailsContainer.appendChild(memberSection);
            }

            // Hide the Add Member button if there are already 4 members
            if (memberDetailsContainer.children.length === 4) {
                addMemberButton.style.display = 'none';
            }
        }

        function removeMember(button) {
            const memberDetailsContainer = document.getElementById('memberDetails');
            const addMemberButton = document.querySelector('.AddMember');

            // Remove the corresponding member section
            const memberSection = button.parentNode;
            memberDetailsContainer.removeChild(memberSection);

            // Show the Add Member button
            addMemberButton.style.display = 'block';
        }
        function checkNexus(){
              if(document.getElementById('name').value=='' || document.getElementById('rollno').value=='' || document.getElementById('year').value=='' || document.getElementById('branch').value=='')
              {
                alert("Please fill all the fields");
        }
        else{
            if(document.getElementById('replay').checked!=true && document.getElementById('nexus').checked!=true && document.getElementById('night').checked!=true )
           {
             alert("Please select atleast one event");
        }

    }
        }
    </script>
    <script>
        


            const scriptURL = 'https://script.google.com/macros/s/AKfycbz3gC3Vt3IhSYG4wMQ3YodS_nwHRYM0nsBvyzIBB43hG9KRait9EUX33vHxoX_3Bldi/exec'
            const form = document.forms['Cascade']
            
            form.addEventListener('submit', e => {
                e.preventDefault()
                fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                // .then(response => alert("Thank you! your form is submitted successfully." ))
                .then(() => { checkNexus()})
                .then(() => {  
                    if(document.getElementById('nexus').checked==true){

                        alert("Your form has been submitted. Redirecting you to a Team Registration page");
                        window.location.href = 'https://echoes-tiet.in/teamRegistration';
                    }
                    else{
                        
                        alert("Your form has been submitted.");
                        window.location.reload();
                    }
                     })
                .catch(error => console.error('Error!', error.message))
            })
        
      </script>
</body>

</html>
